name: Vérifications statiques V30
on:
  push:
    branches:
      - travail-v30-3-reprise
  pull_request:
    branches:
      - travail-v30-3-reprise
jobs:
  static-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/static-regression.test.mjs
